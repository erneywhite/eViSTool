# Сборка и тесты на каждый пуш и pull request; заодно — релизные архивы тем же build/publish.ps1
# и тесты агента на обрезанном релизном exe (артефакт запуска хранится две недели). Ядро и агент — ещё и на Linux:
# там агент держит сервер без окна.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Debug

      - name: Test
        run: dotnet test tests/eViSTool.Core.Tests --no-build -c Debug --logger "console;verbosity=normal"

      - name: Test the window models
        run: dotnet test tests/eViSTool.App.Tests --no-build -c Debug --logger "console;verbosity=normal"

      - name: Release build
        shell: pwsh
        run: ./build/publish.ps1

      - name: Test the release agent
        shell: pwsh
        run: |
          $agent = Get-ChildItem dist -Recurse -Filter eViSTool.Agent.exe | Select-Object -First 1
          $env:EVISTOOL_TEST_AGENT = $agent.FullName
          dotnet test tests/eViSTool.Core.Tests --no-build -c Debug --filter "FullyQualifiedName~AgentTests"

      - uses: actions/upload-artifact@v7
        with:
          name: eViSTool-win-x64
          path: dist/*.zip*
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: eViSTool-linux-x64
          path: dist/*.tar.gz*
          retention-days: 14

  # окно (WPF) на Linux не собирается — только ядро, агент и их тесты
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build tests/eViSTool.Core.Tests -c Debug

      - name: Test
        run: dotnet test tests/eViSTool.Core.Tests --no-build -c Debug --logger "console;verbosity=normal"
