# Сборка и тесты на каждый пуш и pull request; заодно — релизные архивы тем же build/publish.ps1
# и тесты агента на обрезанном релизном exe (артефакт запуска хранится две недели). Ядро и агент — ещё и на Linux:
# там агент держит сервер без окна.
#
# Выпуск — тегом: поднять версию в Directory.Build.props, положить docs/moddb/changelog-<версия>.txt, закоммитить и
#   git tag -a v0.10.5 -m "eViSTool 0.10.5"               — обычный выпуск
#   git tag -a v0.10.5 -m "eViSTool 0.10.5 recommended"   — рекомендуемый (окно выделит обновление)
#   git push origin v0.10.5
# Когда сборка и тесты на обеих системах прошли, задание release собирает архивы, подписывает их ключом из секрета
# UPDATE_SIGNING_KEY и выкладывает релиз с текстом из списка изменений.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# сборке и тестам нужно только читать код — токен запуска не получает права записи в репозиторий
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build -c Debug

      # --blame-hang-timeout: зависший тест (например, бесконечный разбор очереди окна) роняет прогон с его именем через
      # 10 минут, а не держит задачу до общего предела GitHub в 6 часов
      - name: Test
        run: dotnet test tests/eViSTool.Core.Tests --no-build -c Debug --logger "console;verbosity=normal" --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test the window models
        run: dotnet test tests/eViSTool.Presentation.Tests --no-build -c Debug --logger "console;verbosity=normal" --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test the Avalonia window
        run: dotnet test tests/eViSTool.Desktop.Tests --no-build -c Debug --logger "console;verbosity=normal" --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Release build
        shell: pwsh
        run: ./build/publish.ps1

      - name: Test the release agent
        shell: pwsh
        run: |
          $agent = Get-ChildItem dist -Recurse -Filter eViSTool.Agent.exe | Select-Object -First 1
          $env:EVISTOOL_TEST_AGENT = $agent.FullName
          dotnet test tests/eViSTool.Core.Tests --no-build -c Debug --filter "FullyQualifiedName~AgentTests"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eViSTool-win-x64
          path: dist/*-win-x64.zip*
          retention-days: 14

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eViSTool-linux-x64
          path: |
            dist/*-linux-x64.tar.gz*
            dist/*-linux-x64.zip*
          retention-days: 14

  # окно на WPF на Linux не собирается — ядро, агент, окно на Avalonia и их тесты
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: |
          dotnet build tests/eViSTool.Core.Tests -c Debug
          dotnet build tests/eViSTool.Desktop.Tests -c Debug
          dotnet build tests/eViSTool.Presentation.Tests -c Debug

      - name: Test
        run: dotnet test tests/eViSTool.Core.Tests --no-build -c Debug --logger "console;verbosity=normal" --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test the window models
        run: dotnet test tests/eViSTool.Presentation.Tests --no-build -c Debug --logger "console;verbosity=normal" --blame-hang-timeout 10m --blame-hang-dump-type none

      - name: Test the Avalonia window
        run: dotnet test tests/eViSTool.Desktop.Tests --no-build -c Debug --logger "console;verbosity=normal" --blame-hang-timeout 10m --blame-hang-dump-type none

  # собранный архив для Linux — на Linux: агент обрезан полностью (TrimMode=full), окно частично (partial), и то, что
  # обрезка выкинула лишнее, видно только при запуске. Тесты агента — на агенте из архива, окно — снимком экрана
  linux-release:
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: eViSTool-linux-x64
          path: artifact

      - name: Unpack
        shell: pwsh
        run: |
          $tgz = Get-ChildItem artifact -Filter '*-linux-x64.tar.gz' | Select-Object -First 1
          if (-not $tgz) { throw 'Нет tar.gz для Linux среди артефактов' }
          New-Item -ItemType Directory -Force release | Out-Null
          tar -xzf $tgz.FullName -C release
          if ($LASTEXITCODE) { throw "tar: $LASTEXITCODE" }
          foreach ($exe in 'eViSTool', 'eViSTool.Agent') {
              if (-not (Test-Path "release/$exe")) { throw "Нет $exe в архиве" }
              if (-not ((Get-Item "release/$exe").UnixFileMode -band [IO.UnixFileMode]::UserExecute)) { throw "$exe без права на запуск" }
          }

      - name: Test the release agent
        shell: pwsh
        run: |
          dotnet build tests/eViSTool.Core.Tests -c Debug
          $env:EVISTOOL_TEST_AGENT = (Resolve-Path release/eViSTool.Agent).Path
          dotnet test tests/eViSTool.Core.Tests --no-build -c Debug --filter "FullyQualifiedName~AgentTests|FullyQualifiedName~AgentCliTests|FullyQualifiedName~AgentSetupTests"
          if ($LASTEXITCODE) { throw "тесты агента из архива: $LASTEXITCODE" }

      - name: Snapshot the release window
        shell: pwsh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libice6 libsm6 libfontconfig1
          xvfb-run -a pwsh build/snapshot.ps1 -Screens mods,server,settings -AppDir release -Out snapshots
          if ($LASTEXITCODE) { throw "окно из архива не сняло себя: $LASTEXITCODE" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux-release-snapshots
          path: snapshots
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, linux, linux-release]
    runs-on: windows-latest
    timeout-minutes: 30
    # окружение release: в настройках репозитория у него можно потребовать подтверждение перед выкладкой
    environment: release
    # только этому заданию — право выложить релиз; ключ подписи — только ему
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # аннотированный тег целиком: из его сообщения берётся пометка «recommended»

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # имя тега — через переменную окружения, а не подстановкой в текст скрипта: так оно не может стать кодом
      - name: Check the version
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          if ($tag -notmatch '^v[0-9A-Za-z.+-]+$') { throw "Странное имя тега: $tag" }
          $version = $tag.TrimStart('v')
          # выпуск — только с коммита, который уже в main: тег на ветке в стороне релиз не собирает
          git fetch --quiet origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE) { throw "Коммит тега $tag не в main" }
          $declared = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($declared -ne $version) { throw "Тег $tag, а в Directory.Build.props версия $declared" }
          if (-not (Test-Path "docs/moddb/changelog-$version.txt")) { throw "Нет docs/moddb/changelog-$version.txt" }
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          $message = git tag -l --format='%(contents)' $tag
          "version=$version" >> $env:GITHUB_OUTPUT
          # «recommended» — отдельным словом в конце сообщения тега, а не где угодно («not recommended» не в счёт)
          $text = ($message -join ' ').Trim()
          $recommended = $text -match '(^|\s)recommended$' -and $text -notmatch 'not recommended$'
          "recommended=$recommended" >> $env:GITHUB_OUTPUT

      - name: Build and sign
        shell: pwsh
        env:
          EVISTOOL_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          RECOMMENDED: ${{ steps.version.outputs.recommended }}
        run: |
          if (-not $env:EVISTOOL_SIGNING_KEY) { throw 'Нет секрета UPDATE_SIGNING_KEY — неподписанный релиз никто не сможет поставить' }
          ./build/publish.ps1 -Version $env:VERSION
          $notes = @{ Version = $env:VERSION }
          if ($env:RECOMMENDED -eq 'True') { $notes.Recommended = $true }
          ./build/release-notes.ps1 @notes

      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
        run: |
          $v = $env:VERSION
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -like "eViSTool-$v-*" } | ForEach-Object { $_.FullName }
          $sigs = @($files | Where-Object { $_ -like '*.sig' })
          if ($sigs.Count -ne 3) { throw 'Подписей должно быть три: win zip, linux tar.gz, linux zip' }
          # каждую подпись — открытым ключом, зашитым в программу: подписали не тем ключом — выкладывать нельзя,
          # такое обновление никто не поставит
          $pub = [regex]::Match((Get-Content src/eViSTool.Core/AppUpdate/UpdateSignature.cs -Raw), 'ReleaseKey = "([^"]+)"').Groups[1].Value
          if (-not $pub) { throw 'Не нашёл ReleaseKey в UpdateSignature.cs' }
          $key = [Security.Cryptography.ECDsa]::Create()
          $null = $key.ImportSubjectPublicKeyInfo([Convert]::FromBase64String($pub), [ref]0)
          foreach ($sig in $sigs) {
              $archive = $sig.Substring(0, $sig.Length - 4)
              $ok = $key.VerifyData([IO.File]::ReadAllBytes($archive), [Convert]::FromBase64String((Get-Content $sig -Raw).Trim()),
                  [Security.Cryptography.HashAlgorithmName]::SHA256)
              if (-not $ok) { throw "Подпись не сходится с открытым ключом программы: $sig" }
          }
          Write-Host 'Подписи проверены открытым ключом программы.' 
          # бета (0.12.0-beta.1) — pre-release: на GitHub не станет «последней», окно предложит её только тем, кто сам на бете
          $pre = if ($v.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:TAG --title "eViSTool $v" --notes-file "dist/notes-$v.md" --verify-tag @pre @files
